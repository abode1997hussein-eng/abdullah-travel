# يبني تطبيق الأندرويد (android/) على GitHub لأن أدوات الأندرويد موجودة هناك،
# ويحفظ الـ APK بالموقع (download/abdullah-travel.apk) حتى ينزل من زر «حمّل التطبيق».
# مفتاح التوقيع: إذا انضاف سر ANDROID_KEYSTORE_B64 وANDROID_KEYSTORE_PASS يستخدمهم (لازم لـ Google Play
# وحتى التحديثات تنزل فوك النسخة القديمة)، وإذا لا يسوي مفتاح مؤقت.
name: بناء تطبيق الأندرويد

on:
  push:
    branches: [main, new-site]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: مفتاح التوقيع
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KS_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$KS" -storepass abdullah-temp -keypass abdullah-temp \
              -alias abdullah -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Travel with Abdullah, C=IQ"
            echo "KS_PASS=abdullah-temp" >> "$GITHUB_ENV"
            echo "::warning::مفتاح توقيع مؤقت: التحديث الجاي يحتاج حذف التطبيق القديم. ضيف سر ANDROID_KEYSTORE_B64 حتى يثبت."
          fi
          echo "KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: البناء
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: حفظ التطبيق بالموقع
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/release/app-release.apk download/abdullah-travel.apk
          git config user.name "بناء التطبيق"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/abdullah-travel.apk
          git commit -q -m "تطبيق الأندرويد (نسخة ${{ github.run_number }}) [skip ci]"
          git pull -q --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
