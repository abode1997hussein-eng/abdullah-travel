# كل ساعة: ينزّل أكسل الشركة، ياخذ منه الفنادق والمدد وأسعار البيع والتواريخ، يبني الموقع وينشره.
# الأكسل نفسه ما ينحفظ بالمستودع لأن بيه التسديد والعمولة. تكدر تشغّله يدوياً من Actions ← Run workflow.
name: تحديث الأسعار من الأكسل

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تنزيل الأكسل
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/book.xlsx" \
            "https://docs.google.com/spreadsheets/d/1EE1rFTwHFsm6fIUglgcI4zaH1i8FB4gNzmwhPbWogy0/export?format=xlsx"

      - name: أسعار الطيران
        working-directory: src
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python3 -I fares.py | tee -a "$RUNNER_TEMP/build.log"

      - name: بناء الموقع من الأكسل
        working-directory: src
        run: python3 -I build.py --sheet "$RUNNER_TEMP/book.xlsx" | tee -a "$RUNNER_TEMP/build.log"

      - name: الملخص
        run: |
          { echo '```'; cat "$RUNNER_TEMP/build.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: نشر إذا تغيّر شي
        run: |
          git add -N fares.json places.json 2>/dev/null || true
          if git diff --quiet -- index.html fares.json places.json; then echo "ما تغيّر شي"; exit 0; fi
          git config user.name "تحديث الأسعار"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          for f in fares.json places.json; do [ -f "$f" ] && git add "$f"; done
          git commit -q -m "تحديث الأسعار من الأكسل والطيران"
          git pull -q --rebase origin main
          git push
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
