// تطبيق «سافر مع عبدالله»: يفتح الموقع داخل التطبيق، والواتساب والاتصال والخرائط تفتح بتطبيقاتها.
// ينبني على GitHub (.github/workflows/android.yml) لأن أدوات الأندرويد موجودة هناك.
plugins {
    id "com.android.application"
}

android {
    namespace "iq.abdullah.travel"
    compileSdk 34

    defaultConfig {
        applicationId "iq.abdullah.travel"
        minSdk 21
        targetSdk 34
        versionCode((System.getenv("VERSION_CODE") ?: "1") as int)
        versionName "1." + (System.getenv("VERSION_CODE") ?: "0")
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE") ?: "release.jks")
            storePassword System.getenv("KS_PASS")
            keyAlias "abdullah"
            keyPassword System.getenv("KS_PASS")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}
